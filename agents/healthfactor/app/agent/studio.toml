[project]
name = "healthfactor-agent"

[stack]
# Project-lifetime facts: which runtime adapter recipe this Agent was
# scaffolded against. doctor / dev / deploy read these to know what to
# check, load, and route. runtime: agentcore | azure-foundry.
runtime = "agentcore"
# Public faces exposed by this one runtime and signer (canonical order):
#   A2A — serveA2a: agent card + negotiate/notify_funded skills.
#   MCP — streamable-HTTP /mcp: negotiate (signed quote) + notify_funded
#         (verify → deliver → submit, synchronously within the tool call) +
#         read-only chain tools.
#   X402 — publish the sibling /x402 seller route. X402-only still declares
#          A2A natively to AgentCore but suppresses that protocol face at the
#          platform gateway.
protocols = ["A2A"]

[network]
default = "bsc-testnet"

[deploy]
# Legacy scaffold intent: this project was created for the managed BNB trial.
# Deployment still requires an explicit `bag deploy --provider bnb` choice;
# this field is never used as a silent provider default. Post-deploy state is
# recorded under [deploy.platform].
destination = "platform"
# Artifact channel: 'zip' (evm-local default — managed runtime, no Docker)
# or 'container' (local Docker build → brokered ECR; forced for twak).
platform_artifact = "zip"

[wallet]
# Altana custody: the encrypted ADMIN keystore stays under the workspace
# .studio directory. The running Agent receives only the bounded session file.
kind = "altana"
keystore_dir = "../../.studio/wallets"
session_file = "../../.studio/wallets/altana-session.json"
# address = "0x..."   # filled by `bag wallet new`; session must match it
address = "0x886B9cFa0c36dc0fd05F45B03f89fEF56Ed17866"

[llm]
provider = "openrouter"
model = "openai/gpt-4o-mini"
# OpenAI-compatible base. Default OpenRouter: https://openrouter.ai/api/v1
# 9router (or any compatible proxy): set this, or override at runtime with
# LLM_BASE_URL / OPENROUTER_BASE_URL. Env OPENROUTER_API_KEY tetap dipakai
# sebagai Bearer — isinya kunci 9router, bukan OpenRouter.
# base_url = "https://YOUR_9ROUTER_HOST/v1"

[payments.erc8183]
# Read by the Agent: it quotes the FIXED `price`, CLAMPS it to [min,max],
# freezes a short-TTL offer, and EIP-191 signs it — pricing is rule-based, the
# LLM never prices. price=0 is FREE and is supported by the canonical stack.
currency = "0xc70B8741B8B07A6d61E54fd4B20f22Fa648E5565"   # $U token address — prefilled from [network].default; rarely changed
# All prices are in wei of the currency token. U has 18 decimals (not 6 like USDC).
price = "100000000000000000"                    # wei; 0 = FREE (zero token escrow)
min_price = "0"                                # wei — clamp floor
max_price = ""                                 # wei — clamp ceiling; empty = unbounded; SET before going live
quote_ttl_seconds = 900                        # seconds a signed quote stays valid; SDK caps at 900 (~15min work window)
default_estimated_completion_seconds = 600
poll_interval_seconds = 30
auto_settle = false                            # opt-in: detect dispute-window-elapsed → settle

[storage]
# Deliverables written to local disk (file://). Offline-dev only —
# does NOT survive deploy. Path from STORAGE_LOCAL_PATH.
kind = "local"

